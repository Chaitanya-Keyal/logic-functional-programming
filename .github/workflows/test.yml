name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install SWI-Prolog 9 and Racket 8
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swi-prolog-nox racket

      - name: Show versions
        run: |
          swipl --version
          racket --version

      - name: Run all tests
        run: make test
